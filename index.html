<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />

  <meta name="theme-color" content="#3a4a3f" />
  <link rel="icon" href="favicon.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            military: '#3a4a3f',
            'military-light': '#5b6c5f',
            'military-dark': '#2b362f',
            gold: '#FFD700'
          },
          fontFamily: {
            tactical: ['Anton', 'Impact', 'Arial Black', 'system-ui', 'sans-serif'],
            stencil: ['"Stardos Stencil"', 'Arial Black', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: url('squad-9.webp') center/cover no-repeat;
      z-index: -2;
    }
    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.55);
      z-index: -1;
    }
    .gold-gradient {
      background: linear-gradient(90deg, #FFD700, #B8860B, #FFD700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% auto;
      animation: shine 5s linear infinite;
    }
    @keyframes shine { to { background-position: 200% center; } }

    /* Кнопка из текста */
    .bullet-btn {
      font-weight: 900;
      font-size: 1.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #FFD700;
      position: relative;
      display: inline-block;
      transition: transform 0.2s ease, text-shadow 0.2s ease;
    }
    .bullet-btn::after {
      content: "";
      position: absolute;
      left: 0; bottom: -4px;
      width: 100%; height: 3px;
      background: linear-gradient(90deg, #b87333, #ffd700);
      border-radius: 2px;
      opacity: 0;
      transform: scaleX(0);
      transition: all 0.3s ease;
    }
    .bullet-btn:hover {
      transform: scale(1.08);
      text-shadow: 0 0 10px rgba(255,215,0,0.8), 0 0 20px rgba(255,215,0,0.5);
    }
    .bullet-btn:hover::after {
      opacity: 1;
      transform: scaleX(1);
    }
  </style>
</head>

      </section>

      <!-- ZARUBA 3 -->

    </main>

  </div>
</body>
